<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@jhonydias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 48px 16px 64px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Avatar ── */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── Profile Info ── */
        .profile-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }
        .profile-bio {
            font-size: 0.88rem;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.6;
            max-width: 320px;
        }

        /* ── Social Icons ── */
        .social-icons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            text-decoration: none;
            color: #cbd5e0;
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
        }
        .social-icons a:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.1);
            color: #fff;
        }
        .social-icons a svg {
            width: 20px;
            height: 20px;
        }

        /* ── Section Header ── */
        .section-header {
            font-size: 0.72rem;
            font-weight: 700;
            color: #4a5568;
            text-align: center;
            margin: 16px 0 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            width: 100%;
        }

        /* ── Link Button ── */
        .link-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;
            text-decoration: none;
            color: #e2e8f0;
            margin-bottom: 10px;
            overflow: hidden;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s, border-color 0.18s;
            min-height: 58px;
        }
        .link-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .link-btn:active {
            transform: translateY(0);
        }

        /* Em Breve button */
        .link-btn.coming-soon {
            cursor: default;
            opacity: 0.65;
        }
        .link-btn.coming-soon:hover {
            transform: none;
            box-shadow: none;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.09);
        }
        .badge-soon {
            font-size: 0.62rem;
            font-weight: 700;
            background: linear-gradient(90deg, #7928ca, #ff0080);
            color: #fff;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .link-icon {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .link-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .link-icon svg {
            width: 24px;
            height: 24px;
        }

        .link-text {
            flex: 1;
            padding: 12px 16px;
            text-align: center;
        }
        .link-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .link-subtitle {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 3px;
        }

        .link-spacer {
            width: 58px;
            flex-shrink: 0;
        }

        .links-group {
            width: 100%;
        }

        /* ── Divider ── */
        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 10px 0 4px;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 40px;
            font-size: 0.72rem;
            color: #4a5568;
            text-align: center;
            line-height: 1.8;
        }
        .footer a {
            color: #4a5568;
            text-decoration: none;
        }
        .footer a:hover {
            color: #718096;
        }
    </style>
</head>
